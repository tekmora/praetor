# OSV-Scanner configuration for console/pnpm-lock.yaml
# (https://google.github.io/osv-scanner/configuration/). OSV-Scanner applies a config only to
# the lockfiles in its own folder, so the exceptions for this lockfile live here, not in the
# repository root. Every entry is a dated exception: ignoreUntil is the entry date plus the
# interval of its category, and an expired entry no longer suppresses the finding.

# No exception is open. The last one, GHSA-gcqx-w48m-w2h4 (deepmerge 4.3.1), was dropped on
# 2026-11-26: GitHub withdrew that advisory on 2026-11-16 as not describing a vulnerability.
