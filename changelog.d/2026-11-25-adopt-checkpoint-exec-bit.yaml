type: fixed
title: >-
  Adoption installs checkpoint scripts that start with a shebang as executable on POSIX
  and repairs matching copies in place. Preview and adoption both refuse symlinked
  checkpoint parents, parents replaced during the lock wait, and scripts with multiple
  hard links or special permission bits, including already-executable scripts.
