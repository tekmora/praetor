type: changed
title: >-
  Separate structural pointer resolution from live enforcement in `standardsctl rules audit`.
  Read `status` for `present`, `forge-observed`, `forge-pending`, `unresolved`, or `guidance`.
  Empty Make targets and `if: false` workflow jobs fail resolution.
  Use `--remote` to check `enforced`, which requires all pointers to resolve and live forge read-back to match.
  Any unprovable Makefile line leaves every `make:` declaration for that file unresolved, even with `--remote`.
  This includes dot targets other than `.PHONY` (such as `.SUFFIXES` and single- or double-suffix rules), `%` in targets or prerequisites (including static pattern rules), `vpath` directives and `VPATH` assignments.
  Every `make:` pointer is unresolved when the selected makefile has a possible built-in remake source beside it or its directory cannot be read within the 4096-entry limit.
  Variable references in Make rule and assignment comments no longer invalidate a literal recipe.
  When a computed Make rule head cannot be resolved in full to plain path words, every target in it is unresolved, including a literal `verify-all`. Literal heads retain their quoted blanks and backslashes.
  Adoption keeps ambiguous rules in place and credits only confirmed targets. UI and workflow checks resolve fixed target bindings and read prerequisites from the complete logical rule.
  Tracked numeric Makefile includes follow the directory’s actual RCS and SCCS spellings.
  When the audit finds an invalid declaration and cannot write the report, the command returns both errors.
  The computed assignment at `Makefile:8` affects all seven declarations in this repository, including `make:secrets`.
  Migrate affected rules by pointing them at independently verifiable evidence.
issue: "#1134"
breaking: true
