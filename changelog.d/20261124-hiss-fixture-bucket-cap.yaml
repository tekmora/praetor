type: fixed
title: Limit HISS fixture replay to Linux, macOS and Windows. Report each bucket as incomplete on other platforms (HISS-21). Reject replay on overflow, listing errors, kind changes or cleanup failure. Replay equivalent language paths from one bucket and cap replay at 256 regular files. Pin directory handles, retry interrupted reads, and reject Darwin union mounts and malformed names. Check full Windows volume and file IDs with attribute access for skipped directories. Reject spill reads that finish after the fixture deadline.
issue: "2051"
