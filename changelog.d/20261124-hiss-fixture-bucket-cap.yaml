type: fixed
title: Limit HISS fixture replay to Linux, macOS and Windows. On other platforms the CLI reports HISS-21 before loading the catalog, and Verify reports each supplied catalog bucket as incomplete. Report findings, affected claims and total claims. Reject replay on overflow, listing errors, kind changes or cleanup failure. Reject a language directory identity lookup that exceeds its own deadline or identifies a directory already used by another language in the rule. Cap replay at 256 regular files per bucket. Pin directory handles, retain the first observed file identity for entries of unknown kind, retry interrupted Unix opens, metadata lookups and directory reads only while the operation remains live, and reject Darwin union mounts and malformed names. Check full Windows volume and file IDs with attribute access for skipped directories. Reject spill reads that finish after the fixture deadline.
issue: "2051"
