type: fixed
title: Limit HISS fixture replay to Linux, macOS and Windows. On other platforms the CLI reports HISS-21 before loading the catalog, and Verify reports each supplied catalog bucket as incomplete. Report findings, affected claims and total claims. Reject replay on overflow, listing errors, kind changes or cleanup failure. Refuse a second language that resolves to the same fixture directory within a rule. Cap replay at 256 regular files per bucket. Pin directory handles, retain the first observed file identity for entries of unknown kind, retry interrupted Unix opens, metadata lookups and directory reads, and reject Darwin union mounts and malformed names. Check full Windows volume and file IDs with attribute access for skipped directories. Reject spill reads that finish after the fixture deadline.
issue: "2051"
