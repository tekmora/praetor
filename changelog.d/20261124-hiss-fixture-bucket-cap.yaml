type: fixed
title: Limit HISS fixture replay to Linux, macOS and Windows. On other platforms the CLI reports HISS-21 before loading the catalog, and Verify reports each supplied catalog bucket as incomplete. Report findings and claims separately. Reject replay on overflow, listing errors, kind changes or cleanup failure. Replay equivalent language paths from one bucket and cap replay at 256 regular files. Pin directory handles, retain the first observed file identity for entries of unknown kind, retry interrupted reads, and reject Darwin union mounts and malformed names. Check full Windows volume and file IDs with attribute access for skipped directories. Reject spill reads that finish after the fixture deadline.
issue: "2051"
